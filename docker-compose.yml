version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: user-admin-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-admin-api
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongo:27017

volumes:
  mongo-data:
